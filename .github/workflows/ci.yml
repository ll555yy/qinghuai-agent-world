name: qinghuai-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Ordinary CI must never have a real provider credential.  The full-stack
  # job wires its deterministic test ports in test/backend/fullstack_app.py.
  ARK_API_KEY: ''

jobs:
  backend:
    name: backend offline gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/backend/pyproject.toml
      - name: Install backend and lint tooling
        working-directory: core/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest==9.1.1 ruff==0.16.3 mypy==1.20.2
      - name: Scan tracked files for credentials
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -n -I -E -- '-----BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY-----|AKIA[0-9A-Z]{16}|(sk|pk)-live-[A-Za-z0-9]{16,}' -- . ':(exclude).env.example' || true)"
          if [[ -n "${matches}" ]]; then
            printf '%s\n' "${matches}"
            exit 1
          fi
          assignments="$(git grep -n -I -E -- 'ARK_API_KEY[[:space:]]*=[[:space:]]*[A-Za-z0-9_./+=-]{8,}' -- . ':(exclude).env.example' || true)"
          if [[ -n "${assignments}" ]]; then
            printf '%s\n' "${assignments}"
            exit 1
          fi
      - name: Import application without starting a provider
        run: |
          python -c "from core.backend.app.main import app; assert app.title; print(app.title)" \
            | tee backend-import.txt
      - name: Pytest (offline)
        run: |
          mkdir -p backend-artifacts
          python -m pytest -c core/backend/pyproject.toml -q \
            --junitxml=backend-artifacts/pytest.xml
      - name: Ruff
        working-directory: core/backend
        run: python -m ruff check app scripts migrations ../../test/backend
      - name: Mypy
        working-directory: core/backend
        run: python -m mypy
      - name: Upload redacted backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failure-diagnostics
          if-no-files-found: ignore
          path: |
            backend-artifacts/pytest.xml
            backend-import.txt

  postgres:
    name: PostgreSQL persistence and semantic gate
    runs-on: ubuntu-latest
    services:
      database:
        image: pgvector/pgvector:0.8.1-pg17-bookworm
        env:
          POSTGRES_DB: qinghuai_ci
          POSTGRES_USER: qinghuai
          POSTGRES_PASSWORD: qinghuai_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qinghuai -d qinghuai_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 5s
    env:
      QINGHUAI_TEST_DATABASE_URL: postgresql://qinghuai:qinghuai_ci_password@127.0.0.1:5432/qinghuai_ci
      QINGHUAI_PERSISTENCE_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/backend/pyproject.toml
      - name: Install backend and test tooling
        working-directory: core/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest==9.1.1 ruff==0.16.3 mypy==1.20.2
      - name: Upgrade empty database and check migration drift
        working-directory: core/backend
        env:
          DATABASE_URL: postgresql+psycopg://qinghuai:qinghuai_ci_password@127.0.0.1:5432/qinghuai_ci
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: PostgreSQL persistence and semantic tests (no skip authority)
        env:
          # Do not expose a process-level DATABASE_URL to the semantic tests;
          # their dedicated-URL guard should see only QINGHUAI_TEST_DATABASE_URL.
          DATABASE_URL: ''
        run: |
          mkdir -p postgres-artifacts
          python -m pytest -c core/backend/pyproject.toml -q \
            test/backend/integration/test_postgres_persistence.py \
            test/backend/integration/test_semantic_evaluation_postgres.py \
            --junitxml=postgres-artifacts/pytest.xml
      - name: Upload redacted PostgreSQL diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-failure-diagnostics
          if-no-files-found: ignore
          path: postgres-artifacts/pytest.xml

  frontend:
    name: frontend frozen gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: core/frontend/pnpm-lock.yaml
      - name: Frozen install
        working-directory: core/frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: core/frontend
        run: pnpm lint
      - name: Typecheck
        working-directory: core/frontend
        run: pnpm typecheck
      - name: Vitest
        working-directory: core/frontend
        run: pnpm test
      - name: Production build
        working-directory: core/frontend
        run: pnpm build
      - name: Install Chromium for the browser contract suite
        working-directory: core/frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Existing Playwright browser suite
        working-directory: core/frontend
        run: pnpm test:e2e
      - name: Upload redacted browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-failure-diagnostics
          if-no-files-found: ignore
          path: |
            core/frontend/playwright-report
            core/frontend/test-results

  fullstack:
    name: full-stack golden Playwright gate
    runs-on: ubuntu-latest
    needs: [postgres]
    services:
      database:
        image: pgvector/pgvector:0.8.1-pg17-bookworm
        env:
          POSTGRES_DB: qinghuai_fullstack_ci
          POSTGRES_USER: qinghuai
          POSTGRES_PASSWORD: qinghuai_fullstack_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qinghuai -d qinghuai_fullstack_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 5s
    env:
      DATABASE_URL: postgresql+psycopg://qinghuai:qinghuai_fullstack_password@127.0.0.1:5432/qinghuai_fullstack_ci
      QINGHUAI_TEST_DATABASE_URL: postgresql://qinghuai:qinghuai_fullstack_password@127.0.0.1:5432/qinghuai_fullstack_ci
      QINGHUAI_PERSISTENCE_BACKEND: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/backend/pyproject.toml
      - name: Install backend
        working-directory: core/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Migrate empty full-stack database
        working-directory: core/backend
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: core/frontend/pnpm-lock.yaml
      - name: Frozen frontend install and browser
        working-directory: core/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Start explicit test app (no Ark client)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fullstack-artifacts
          nohup python test/backend/fullstack_server.py \
            > fullstack-artifacts/backend.log 2>&1 &
          echo $! > fullstack-artifacts/backend.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > fullstack-artifacts/health.json; then
              exit 0
            fi
            sleep 1
          done
          sed -E 's/(ARK_API_KEY|Authorization|password)[^[:space:]]*/REDACTED/gi' \
            fullstack-artifacts/backend.log || true
          exit 1
      - name: Real full-stack Playwright golden path
        working-directory: core/frontend
        env:
          CI: 'true'
        run: pnpm test:e2e:fullstack
      - name: Redact full-stack diagnostics
        if: always()
        shell: bash
        run: |
          if [[ -f fullstack-artifacts/backend.log ]]; then
            sed -E 's/(ARK_API_KEY|Authorization|password)[^[:space:]]*/REDACTED/gi' \
              fullstack-artifacts/backend.log > fullstack-artifacts/backend-redacted.log
          fi
      - name: Upload redacted full-stack diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-failure-diagnostics
          if-no-files-found: ignore
          path: |
            core/frontend/playwright-report
            core/frontend/test-results
            fullstack-artifacts/backend-redacted.log
            fullstack-artifacts/health.json
