name: qinghuai-chat

services:
  database:
    image: pgvector/pgvector:0.8.1-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qinghuai}
      POSTGRES_USER: ${POSTGRES_USER:-qinghuai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qinghuai_dev_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - qinghuai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  qinghuai-postgres:
