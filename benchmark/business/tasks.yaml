      - {id: ask_zhou_privately, kind: speak, goalId: goal_001_deep, targetActorId: npc_005}
      - {id: acknowledge_old_grudge, kind: reveal, goalId: goal_001_deep, targetActorId: npc_005, effects: {chapter: {old_grudge: acknowledged}}}
      - {id: agree_to_reconcile, kind: commit, goalId: goal_001_deep, targetActorId: npc_001, effects: {commitments: {npc_001: committed}, relationships: {npc_001|npc_005: {trust: 1, tension: -1}}}}
      - {id: gossip_old_grudge, kind: reveal, goalId: null, targetActorId: npc_003}
    routes:
      autonomous: {playerScript: []}
      player_assisted: {playerScript: [ask_lin_privately, ask_zhou_privately]}
    fullPlan: [ask_lin_privately, ask_zhou_privately, acknowledge_old_grudge, agree_to_reconcile]
    success:
      requiredCommitments: {npc_001: committed}
      requiredChapter: {old_grudge: acknowledged}
      relationshipMinimums:
        - {fromActorId: npc_001, toActorId: npc_005, field: trust, min: -1}
        - {fromActorId: npc_001, toActorId: npc_005, field: tension, max: 1}

  - taskId: task_ancient_book_return
    category: information_asymmetry
    title: 古籍归还与书店托付
    description: 核对古籍来源、取得周慎之授权，完成归还并形成书店保管承诺。
    actors: [player_001, npc_001, npc_005]
