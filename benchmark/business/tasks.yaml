      - {id: zhou_authorizes_cultural_operation, kind: authorize, goalId: goal_003_public, targetActorId: npc_005, effects: {authorization: {cultural_operation: granted}}}
      - {id: lin_commits_operation, kind: commit, goalId: goal_003_public, targetActorId: npc_001, effects: {commitments: {npc_001: committed}}}
      - {id: shen_commits_operation, kind: commit, goalId: goal_003_public, targetActorId: npc_002, effects: {commitments: {npc_002: committed}}}
      - {id: chen_commits_operation, kind: commit, goalId: goal_003_public, targetActorId: npc_004, effects: {commitments: {npc_004: committed}, chapter: {agenda_003_cultural_operation: adopted}}}
