version: 1
suite: business
description: >-
  Frozen business-task catalog for the Qinghuai seven-day world.  The task
  effects below are backend-state effects, not text matches; a live adapter may
  map the action ids to the production RunService commands.
defaults:
  maxSteps: 12
  legalActions:
    - id: wait
      kind: wait
      goalId: null
  routes:
    autonomous:
      playerScript: []
    player_assisted:
      playerScript: []
