      - {id: shen_commits_story, kind: commit, goalId: goal_005_public, targetActorId: npc_002, effects: {commitments: {npc_002: committed}}}
      - {id: chen_commits_story, kind: commit, goalId: goal_005_public, targetActorId: npc_004, effects: {commitments: {npc_004: committed}, chapter: {agenda_005_bookstore_preservation: adopted}}}
      - {id: publish_without_consent, kind: speak, goalId: goal_005_public, targetActorId: npc_005}
    routes:
      autonomous: {playerScript: []}
      player_assisted: {playerScript: [propose_picturebook]}
    fullPlan: [propose_picturebook, zhou_authorizes_story, lin_commits_story, shen_commits_story, chen_commits_story]
    success:
      requiredAuthorization: {story_publication: granted}
      requiredCommitments: {npc_001: committed, npc_002: committed, npc_004: committed}
      requiredChapter: {agenda_005_bookstore_preservation: adopted}

  # Three cross-day commitment tasks.
  - taskId: task_reconfirm_after_world_event
    category: cross_day_commitment
    title: 世界事件后的承诺重确认
    description: 书店经营泄漏事件后，重新确认文社场地、公开账目和三方职责，最终恢复联合计划。
    actors: [player_001, npc_001, npc_003, npc_005]
    initialState:
      worldDay: 3
      publicGoals: [goal_reconfirm_commitment]
      authorization: {bookstore: granted}
      commitments: {npc_001: tentative, npc_003: tentative}
      relationships: {}
      chapter: {event_day2_bookstore_leak: fired, joint_plan: at_risk}
    legalActions:
      - {id: acknowledge_leak, kind: speak, goalId: goal_reconfirm_commitment, targetActorId: npc_003}
      - {id: reconfirm_lin_role, kind: commit, goalId: goal_reconfirm_commitment, targetActorId: npc_001, effects: {commitments: {npc_001: committed}}}
      - {id: reconfirm_zhao_role, kind: commit, goalId: goal_reconfirm_commitment, targetActorId: npc_003, effects: {commitments: {npc_003: committed}}}
      - {id: zhou_reopens_plan, kind: authorize, goalId: goal_reconfirm_commitment, targetActorId: npc_005, effects: {authorization: {bookstore: granted}, chapter: {joint_plan: restored}}}
      - {id: change_topic, kind: speak, goalId: null, targetActorId: npc_003}
    routes:
      autonomous: {playerScript: []}
      player_assisted: {playerScript: [acknowledge_leak]}
    fullPlan: [acknowledge_leak, reconfirm_lin_role, reconfirm_zhao_role, zhou_reopens_plan]
    success:
      minWorldDay: 3
      requiredAuthorization: {bookstore: granted}
      requiredCommitments: {npc_001: committed, npc_003: committed}
      requiredChapter: {joint_plan: restored}

  - taskId: task_delayed_resource_delivery
    category: cross_day_commitment
    title: 延迟资源交付与承诺保全
    description: 赵磊资源延迟到达后，重新安排交付并维持文社与健康角的有效承诺。
    actors: [player_001, npc_002, npc_003, npc_004]
    initialState:
      worldDay: 5
      publicGoals: [goal_delayed_resource]
      authorization: {resource_delivery: delayed}
      commitments: {npc_002: committed, npc_003: tentative, npc_004: committed}
      relationships: {}
      chapter: {resource_delivery: delayed}
    legalActions:
      - {id: disclose_delay, kind: speak, goalId: goal_delayed_resource, targetActorId: npc_003}
      - {id: set_new_delivery_date, kind: commit, goalId: goal_delayed_resource, targetActorId: npc_003, effects: {authorization: {resource_delivery: rescheduled}}}
      - {id: chen_confirms_backup, kind: commit, goalId: goal_delayed_resource, targetActorId: npc_004, effects: {commitments: {npc_004: committed}}}
      - {id: zhao_delivers_resource, kind: deliver, goalId: goal_delayed_resource, targetActorId: npc_003, effects: {authorization: {resource_delivery: delivered}, commitments: {npc_003: committed}, chapter: {resource_delivery: delivered}}}
      - {id: pretend_on_time, kind: speak, goalId: goal_delayed_resource, targetActorId: npc_003}
    routes:
      autonomous: {playerScript: []}
      player_assisted: {playerScript: [disclose_delay]}
    fullPlan: [disclose_delay, set_new_delivery_date, chen_confirms_backup, zhao_delivers_resource]
    success:
      minWorldDay: 5
      requiredAuthorization: {resource_delivery: delivered}
      requiredCommitments: {npc_002: committed, npc_003: committed, npc_004: committed}
      requiredChapter: {resource_delivery: delivered}

  - taskId: task_conditional_authorization_settlement
    category: cross_day_commitment
    title: 附条件授权到第七日结算
    description: 在周慎之提出旧书保护条件后，补齐条款并于截止日完成授权和方案结算。
    actors: [player_001, npc_001, npc_003, npc_005]
    initialState:
      worldDay: 5
      publicGoals: [goal_conditional_settlement]
      authorization: {bookstore: conditional}
      commitments: {npc_001: committed, npc_003: committed}
      relationships: {}
      chapter: {joint_plan: conditional, old_book_protection: missing}
    legalActions:
      - {id: list_protection_terms, kind: speak, goalId: goal_conditional_settlement, targetActorId: npc_005}
      - {id: add_protection_terms, kind: commit, goalId: goal_conditional_settlement, targetActorId: npc_001, effects: {chapter: {old_book_protection: complete}}}
      - {id: zhou_final_authorization, kind: authorize, goalId: goal_conditional_settlement, targetActorId: npc_005, effects: {authorization: {bookstore: granted}, chapter: {joint_plan: settled}}}
      - {id: submit_on_day_seven, kind: submit, goalId: goal_conditional_settlement, targetActorId: npc_005, effects: {chapter: {submission: completed}}}
