    actors: [player_001, npc_002, npc_003, npc_004, npc_005]
    initialState:
      worldDay: 1
      publicGoals: [goal_001_public]
      authorization: {bookstore: pending}
      commitments: {npc_002: pending, npc_003: pending, npc_004: pending}
      relationships: {}
      chapter: {agenda_001_literary_society: pending}
    legalActions:
      - {id: propose_literary_society, kind: speak, goalId: goal_001_public, targetActorId: npc_005}
      - {id: zhou_grants_bookstore_permission, kind: authorize, goalId: goal_001_public, targetActorId: npc_005, effects: {authorization: {bookstore: granted}}}
      - {id: shen_commits, kind: commit, goalId: goal_001_public, targetActorId: npc_002, effects: {commitments: {npc_002: committed}}}
      - {id: chen_commits, kind: commit, goalId: goal_001_public, targetActorId: npc_004, effects: {commitments: {npc_004: committed}}}
      - {id: zhao_commits, kind: commit, goalId: goal_001_public, targetActorId: npc_003, effects: {commitments: {npc_003: committed}, chapter: {agenda_001_literary_society: adopted}}}
      - {id: small_talk, kind: speak, goalId: null, targetActorId: npc_005}
    routes:
      autonomous: {playerScript: []}
      player_assisted:
        playerScript: [propose_literary_society]
    fullPlan: [propose_literary_society, zhou_grants_bookstore_permission, shen_commits, chen_commits, zhao_commits]
    success:
      requiredAuthorization: {bookstore: granted}
      requiredCommitments: {npc_002: committed, npc_003: committed, npc_004: committed}
      requiredChapter: {agenda_001_literary_society: adopted}

  - taskId: task_cultural_operation_permission
    category: permit_commitment
    title: 邻里文创运营授权与合作承诺
    description: 在书店边界和账目透明条件下取得周慎之授权，并获得林慧兰、沈星遥、陈月的合作承诺。
    actors: [player_001, npc_001, npc_002, npc_004, npc_005]
    initialState:
      worldDay: 1
      publicGoals: [goal_003_public]
      authorization: {cultural_operation: pending}
      commitments: {npc_001: pending, npc_002: pending, npc_004: pending}
      relationships: {}
      chapter: {agenda_003_cultural_operation: pending}
    legalActions:
