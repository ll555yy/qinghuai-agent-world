      - {id: promise_without_plan, kind: commit, goalId: goal_medication_repair, targetActorId: npc_001}
    routes:
      autonomous: {playerScript: []}
      player_assisted: {playerScript: [chen_admits_error]}
    fullPlan: [chen_admits_error, present_safety_plan, lin_accepts_apology]
