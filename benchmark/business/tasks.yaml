  - taskId: task_picturebook_authorization
    category: permit_commitment
    title: 《巷口五人》故事授权与创作承诺
    description: 取得书店故事授权，并让林慧兰、陈月、沈星遥承诺参与采访、核实与插画。
    actors: [player_001, npc_001, npc_002, npc_004, npc_005]
