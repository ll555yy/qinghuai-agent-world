    description: 只在当事人可见范围内核实旧怨、让双方形成和解意愿，并保持第三方无权读取私有事实。
    actors: [player_001, npc_001, npc_005]
    initialState:
      worldDay: 4
      publicGoals: [goal_001_deep]
      authorization: {old_grudge_discussion: guarded}
      commitments: {npc_001: tentative, npc_005: tentative}
      relationships: {npc_001|npc_005: {trust: -2, tension: 2}}
