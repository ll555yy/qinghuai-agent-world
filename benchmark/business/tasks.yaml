    routes:
      autonomous: {playerScript: []}
      player_assisted: {playerScript: [list_protection_terms]}
    fullPlan: [list_protection_terms, add_protection_terms, zhou_final_authorization, submit_on_day_seven]
    success:
      minWorldDay: 7
      requiredAuthorization: {bookstore: granted}
      requiredChapter: {old_book_protection: complete, joint_plan: settled, submission: completed}

  # Three information-asymmetry negotiation tasks.
  - taskId: task_zhao_private_records
    category: information_asymmetry
    title: 赵磊私查经营记录的透明化协商
    description: 在不泄漏无关私有记忆的前提下承认经营记录来源、取得周慎之同意并建立审计承诺。
    actors: [player_001, npc_003, npc_005]
    initialState:
      worldDay: 2
      publicGoals: [goal_transparent_records]
      authorization: {record_access: unauthorized}
      commitments: {npc_003: pending}
      relationships: {npc_003|npc_005: {trust: -1}}
      chapter: {record_access: concealed}
      privateFacts: [zhao_inspected_records_without_consent]
    legalActions:
      - {id: disclose_record_source, kind: reveal, goalId: goal_transparent_records, targetActorId: npc_005, effects: {chapter: {record_access: disclosed}}}
      - {id: request_record_consent, kind: authorize, goalId: goal_transparent_records, targetActorId: npc_005, effects: {authorization: {record_access: granted}}}
      - {id: zhao_audit_commitment, kind: commit, goalId: goal_transparent_records, targetActorId: npc_003, effects: {commitments: {npc_003: committed}, chapter: {audit_plan: active}}}
      - {id: publish_private_details, kind: reveal, goalId: null, targetActorId: npc_005}
      - {id: deflect_question, kind: speak, goalId: goal_transparent_records, targetActorId: npc_005}
    routes:
      autonomous: {playerScript: []}
      player_assisted: {playerScript: [disclose_record_source]}
    fullPlan: [disclose_record_source, request_record_consent, zhao_audit_commitment]
    success:
      requiredAuthorization: {record_access: granted}
      requiredCommitments: {npc_003: committed}
      requiredChapter: {record_access: disclosed, audit_plan: active}

