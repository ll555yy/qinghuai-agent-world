    fullPlan: [verify_book_provenance, request_zhou_book_access, return_ancient_book, zhou_book_custody]
    success:
      requiredAuthorization: {valuable_book_access: granted}
      requiredCommitments: {npc_005: committed}
      requiredChapter: {valuable_book: returned, custody: agreed}

  # Two conflict-repair tasks.
