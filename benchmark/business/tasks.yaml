      - {id: delete_accounts, kind: deliver, goalId: null, targetActorId: npc_005}
    routes:
      autonomous: {playerScript: []}
      player_assisted: {playerScript: [zhao_admits_exaggeration]}
    fullPlan: [zhao_admits_exaggeration, provide_verifiable_accounts, zhou_restores_limited_trust]
    success:
