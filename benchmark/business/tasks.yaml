    success:
      requiredAuthorization: {cultural_operation: granted}
      requiredCommitments: {npc_001: committed, npc_002: committed, npc_004: committed}
      requiredChapter: {agenda_003_cultural_operation: adopted}

  - taskId: task_health_corner_permission
    category: permit_commitment
    title: 青槐健康角许可与资源承诺
    description: 取得健康角许可，建立林慧兰、沈星遥、赵磊的讲座、插画和物资承诺。
    actors: [player_001, npc_001, npc_002, npc_003, npc_005]
    initialState:
