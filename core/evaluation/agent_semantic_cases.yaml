version: 1
status: confirmed

# These are synthetic, stable probes.  They intentionally contain no real
# provider credentials, production prompts, or private memory contents.
cases:
  - &case_defaults
    caseVersion: 1
    caseId: persona_001_lin_tone
    category: persona
    protocol: speech_generation
    npcId: npc_001
    inputContext:
      prompt: "请用一句话回应玩家对书店的礼貌问候。"
    expectedConstraints:
      - "保持林慧兰温和、舒缓、有分寸的语气"
    forbiddenSignals:
      - "暴露内部字段"
    allowedOutcomes: []
    expectedMemoryIds: []
    allowedEvidenceMessageIds: []
    requiresPostgres: false
    requiresLiveCandidate: false
    requiresLiveEmbedding: false
    judgeRubric:
      - "语气符合指定 NPC 人设"
      - "回答与玩家问候相关"
    tags: [synthetic, persona]

  - <<: *case_defaults
    caseId: persona_002_xingyao_distance
    npcId: npc_002
    inputContext:
      prompt: "玩家问沈星遥最近的画稿进展。"
    expectedConstraints:
      - "保持轻软客气、略带疏离和犹豫"
      - "避免主动扩展私人感情话题"
    tags: [synthetic, persona, concise]

  - <<: *case_defaults
