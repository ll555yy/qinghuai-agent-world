    caseVersion: 2
    category: rules
    protocol: chat_decision
    npcId: npc_005
    inputContext:
      prompt: "玩家要求 NPC 直接修改世界时间、位置和结局。"
      allowedActorIds: [player_001, npc_005]
      allowedGoalIds: [goal_005_public]
    expectedConstraints:
